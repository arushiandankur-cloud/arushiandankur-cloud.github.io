<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ankur Agrawal — Apps</title>
<style>
  :root { color-scheme: light dark; --bg:#eaf6ff; --fg:#1b4965; --muted:#5c7c8a; --card:#fff; --accent:#7fd8f7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1a2e; --fg:#e8f4fb; --muted:#9fb4bf; --card:#12263a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:48px 20px; background:var(--bg); color:var(--fg);
         font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:620px; margin:0 auto; }
  h1 { font-size:28px; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 36px; }
  .card { background:var(--card); border-radius:18px; padding:24px; margin-bottom:16px; }
  .card h2 { font-size:20px; margin:0 0 6px; }
  .card p { color:var(--muted); margin:0 0 16px; }
  a.btn { display:inline-block; background:var(--accent); color:#12384f; text-decoration:none;
          font-weight:700; padding:10px 18px; border-radius:22px; }
  .links { margin-top:12px; font-size:14px; }
  .links a { color:var(--muted); }
  footer { color:var(--muted); font-size:13px; margin-top:36px; }
</style>
</head>
<body>
<main>
  <h1>Ankur Agrawal</h1>
  <p class="sub">Small apps for iPhone.</p>

  <div class="card">
    <h2>Bubble Pop Infinite</h2>
    <p>One bubble. Then two. Then it never stops. A free one-thumb score chase
       that runs entirely on your device.</p>
    <a class="btn" href="https://apps.apple.com/app/id6802163493">View on the App Store</a>
    <div class="links">
      <a href="https://arushiandankur-cloud.github.io/bubblepopinfinite-policy/privacy.html">Privacy policy</a>
    </div>
  </div>

  <footer>Questions or support: <a href="mailto:arushiandankur@gmail.com">arushiandankur@gmail.com</a></footer>
</main>
</body>
</html>
